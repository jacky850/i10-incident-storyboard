<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZ511 Archive Viewer</title>
<style>
  :root { --bg: #f6f6f4; --panel: #fff; --ink: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4; --accent: #003863; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --panel: #212121; --ink: #ececea; --muted: #a0a09a; --line: #3a3a38; --accent: #6fa8dc; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0; }
  select, input, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #event { max-width: 100%; flex: 1 1 420px; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 150px; }
  #slider { flex: 1 1 300px; }
  #cams { display: flex; flex-wrap: wrap; gap: 4px 10px; max-height: 92px; overflow: auto; font-size: 12px; color: var(--muted); }
  #cams label { white-space: nowrap; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 12px; padding: 12px 16px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  figure img { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; background: #000; cursor: zoom-in; }
  figcaption { padding: 6px 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  figcaption b { color: var(--ink); }
  .stale { color: #d55e00; }
  .hint { font-size: 12px; color: var(--muted); }
  @media (max-width: 480px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <select id="event"><option value="">Jump to an incident…</option></select>
  </div>
  <div class="row">
    <input type="datetime-local" id="when" step="60">
    <button data-step="-60">−1 h</button><button data-step="-10">−10 min</button><button data-step="-1">−1 min</button>
    <button data-step="1">+1 min</button><button data-step="10">+10 min</button><button data-step="60">+1 h</button>
    <button id="play">▶ Play</button>
    <span id="clock"></span>
  </div>
  <div class="row"><input type="range" id="slider" min="0" max="1439" step="1"></div>
  <div id="cams"></div>
  <div class="hint">Local time (America/Phoenix). Frames are read directly from the daily tar archives. Click an image to open it full size. Keys: ← → step 1 min.</div>
</header>
<main id="grid"></main>
<script>
const $ = (s) => document.querySelector(s);
let meta, chosen = new Set(), playing = null;

function pad(n) { return String(n).padStart(2, "0"); }
function fmt(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function current() { return new Date($("#when").value); }
function setTime(d) {
  $("#when").value = fmt(d);
  $("#slider").value = d.getHours() * 60 + d.getMinutes();
  $("#clock").textContent = d.toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  render();
}

async function render() {
  const t = $("#when").value;
  const grid = $("#grid");
  grid.innerHTML = "";
  for (const cam of chosen) {
    const info = meta.cameras.find((c) => c.id === cam);
    const fig = document.createElement("figure");
    fig.innerHTML = `<img alt="Camera ${cam} near ${t}"><figcaption><span><b>${cam}</b> ${info.view}</span><span class="t">…</span></figcaption>`;
    grid.appendChild(fig);
    fetch(`/api/nearest?cam=${cam}&t=${t}`).then((r) => r.json()).then((f) => {
      if (!f.path) { fig.querySelector(".t").textContent = "no frames"; return; }
      const img = fig.querySelector("img");
      img.src = `/img?path=${encodeURIComponent(f.path)}`;
      img.onclick = () => window.open(img.src, "_blank");
      const span = fig.querySelector(".t");
      span.textContent = `${f.t.slice(11)} (${f.off_s >= 0 ? "+" : ""}${f.off_s}s)`;
      if (Math.abs(f.off_s) > 180) span.classList.add("stale");
    });
  }
}

function drawCams() {
  $("#cams").innerHTML = meta.cameras.map((c) =>
    `<label><input type="checkbox" value="${c.id}" ${chosen.has(c.id) ? "checked" : ""}> ${c.id} ${c.Location.replace("I-10 @", "")}</label>`).join("");
  $("#cams").querySelectorAll("input").forEach((box) => box.onchange = () => {
    box.checked ? chosen.add(box.value) : chosen.delete(box.value);
    render();
  });
}

function step(min) { const d = current(); d.setMinutes(d.getMinutes() + min); setTime(d); }

async function init() {
  meta = await (await fetch("/api/meta")).json();
  const ev = $("#event");
  meta.events.forEach((e, i) => ev.insertAdjacentHTML("beforeend", `<option value="${i}">${e.label}</option>`));
  ev.onchange = () => {
    if (ev.value === "") return;
    const e = meta.events[+ev.value];
    chosen = new Set(e.cams.slice(0, 4));
    drawCams();
    const d = new Date(e.t); d.setMinutes(d.getMinutes() - 5); setTime(d);
  };
  chosen = new Set(["1260", "1261"]);
  drawCams();
  document.querySelectorAll("[data-step]").forEach((b) => b.onclick = () => step(+b.dataset.step));
  $("#when").onchange = () => setTime(current());
  $("#slider").oninput = () => { const d = current(); d.setHours(0, +$("#slider").value); setTime(d); };
  $("#play").onclick = () => {
    if (playing) { clearInterval(playing); playing = null; $("#play").textContent = "▶ Play"; return; }
    playing = setInterval(() => step(1), 1200); $("#play").textContent = "❚❚ Pause";
  };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
  });
  setTime(new Date("2026-09-15T17:30"));
}
init();
</script>
</body>
</html>
